    <script>

        tailwind.config = {

            darkMode: 'class',

            theme: {

                extend: {

                    colors: {

                        'text-color': '#1a1a1a',

                        'accent-color': '#4a4a4a',

                        'subtext-color': '#666666',

                        'link-color': '#000000'

                    },

                    fontFamily: {

                        mono: ['JetBrains Mono', 'monospace']

                    },

                    keyframes: {

                        blink: {

                            '0%, 100%': { opacity: '1' },

                            '50%': { opacity: '0' }

                        },

                        fadeIn: {

                            from: { opacity: '0', transform: 'translateY(10px)' },

                            to: { opacity: '1', transform: 'translateY(0)' }

                        }

                    },

                    animation: {

                        blink: 'blink 1s step-end infinite',

                        fadeIn: 'fadeIn 0.8s ease forwards'

                    }

                }

            }

        };



        // Dark mode is enabled by default, before the page renders.

        (() => {

            const savedTheme = localStorage.getItem('theme');

            if (savedTheme === null || savedTheme === 'dark') {

                document.documentElement.classList.add('dark');

            }

        })();

    </script>



    <style>
        html {

            color-scheme: light;

        }



        html {

            font-size: clamp(12px, 2.5vw, 16px);

        }



        html.dark {

            color-scheme: dark;

        }



        html.dark body {

            background-color: #000;

            color: #fff;

        }



        .item-list>li {

            position: relative;

            padding-left: 1.2rem;

        }



        .item-list>li::before {

            content: "—";

            position: absolute;

            left: 0;

            color: #ccc;

        }



        html.dark .item-list>li::before {

            color: #4b5563;

        }



        .fade-section:nth-child(2) {

            animation-delay: 0.1s;

        }



        .fade-section:nth-child(3) {

            animation-delay: 0.2s;

        }



        .fade-section:nth-child(4) {

            animation-delay: 0.3s;

        }



        .fade-section:nth-child(5) {

            animation-delay: 0.4s;

        }



        .fade-section:nth-child(6) {

            animation-delay: 0.5s;

        }



        .fade-section:nth-child(7) {

            animation-delay: 0.6s;

        }



        .cursor-custom {

            display: inline-block;

            width: 8px;

            height: 1.2em;

            background-color: #1a1a1a;

            margin-left: 4px;

            vertical-align: text-bottom;

            animation: blink 1s step-end infinite;

        }



        html.dark .cursor-custom {

            background-color: #fff;

        }



        /* Section navigation */

        .section-tab {

            position: relative;

            flex-shrink: 0;

            padding: 0.75rem 0;

            font-size: 0.875rem;

            white-space: nowrap;

            transition: color 200ms ease;

            cursor: pointer;

        }



        .section-tab:focus-visible {

            outline: 2px solid currentColor;

            outline-offset: 4px;

            border-radius: 2px;

        }



        /* Inactive sections are completely removed from the layout. */

        .portfolio-panel[hidden] {

            display: none !important;

        }



        .portfolio-panel.active {

            display: block;

            animation: panelSlideIn 280ms ease both;

        }



        @keyframes panelSlideIn {

            from {

                opacity: 0;

                transform: translateY(8px);

            }



            to {

                opacity: 1;

                transform: translateY(0);

            }

        }



        #nav-indicator {

            position: absolute;

            bottom: -1px;

            left: 0;

            height: 2px;

            width: 0;

            background-color: #111;

            transition: width 280ms ease, transform 280ms ease;

            pointer-events: none;

        }



        html.dark #nav-indicator {

            background-color: #fff;

        }



        @media (prefers-reduced-motion: reduce) {

            .portfolio-panel.active {

                animation: none;

            }



            #nav-indicator,

            .section-tab {

                transition: none;

            }



            .cursor-custom {

                animation: none;

            }

        }
    </style>

</head>

    <script>

        // --- Dark Mode Logic ---

        const themeToggle = document.getElementById('theme-toggle');

        const htmlElement = document.documentElement;

        const themeIcon = document.getElementById('theme-icon');



        function applyTheme() {

            const savedTheme = localStorage.getItem('theme');

            const isDark = savedTheme === null || savedTheme === 'dark';



            htmlElement.classList.toggle('dark', isDark);

            themeIcon.classList.toggle('fa-moon', isDark);

            themeIcon.classList.toggle('fa-sun', !isDark);

            themeToggle.setAttribute(

                'aria-label',

                isDark ? 'Switch to light mode' : 'Switch to dark mode'

            );



            if (savedTheme === null) {

                localStorage.setItem('theme', 'dark');

            }

        }



        themeToggle.addEventListener('click', () => {

            const isDark = htmlElement.classList.toggle('dark');

            localStorage.setItem('theme', isDark ? 'dark' : 'light');



            themeIcon.classList.toggle('fa-moon', isDark);

            themeIcon.classList.toggle('fa-sun', !isDark);

            themeToggle.setAttribute(

                'aria-label',

                isDark ? 'Switch to light mode' : 'Switch to dark mode'

            );

        });



        applyTheme();



        // --- Sliding Navbar / Single-Section Navigation ---

        const sectionNav = document.getElementById('section-nav');

        const navTabs = Array.from(sectionNav.querySelectorAll('.section-tab'));

        const navIndicator = document.getElementById('nav-indicator');



        function moveNavIndicator(tab) {

            navIndicator.style.width = `${tab.offsetWidth}px`;

            navIndicator.style.transform = `translateX(${tab.offsetLeft}px)`;

        }



        function activateSection(tab, moveFocus = false) {

            const targetId = tab.dataset.target;

            const targetPanel = document.getElementById(targetId);



            if (!targetPanel) return;



            // Hide every section before showing the selected one.

            document.querySelectorAll('.portfolio-panel').forEach(panel => {

                panel.classList.remove('active');

                panel.hidden = true;

            });



            targetPanel.hidden = false;

            targetPanel.classList.add('active');



            // Update selected tab styling and accessibility attributes.

            navTabs.forEach(item => {

                const selected = item === tab;



                item.setAttribute('aria-selected', String(selected));

                item.setAttribute('tabindex', selected ? '0' : '-1');



                item.classList.toggle('text-gray-900', selected);

                item.classList.toggle('dark:text-white', selected);

                item.classList.toggle('text-gray-500', !selected);

                item.classList.toggle('dark:text-gray-400', !selected);

            });



            moveNavIndicator(tab);



            if (moveFocus) {

                tab.focus();

            }

        }



        navTabs.forEach((tab, index) => {

            tab.addEventListener('click', () => activateSection(tab));



            // Keyboard support for tab-style navigation.

            tab.addEventListener('keydown', event => {

                let nextIndex = index;



                if (event.key === 'ArrowRight') {

                    nextIndex = (index + 1) % navTabs.length;

                } else if (event.key === 'ArrowLeft') {

                    nextIndex = (index - 1 + navTabs.length) % navTabs.length;

                } else if (event.key === 'Home') {

                    nextIndex = 0;

                } else if (event.key === 'End') {

                    nextIndex = navTabs.length - 1;

                } else {

                    return;

                }



                event.preventDefault();

                activateSection(navTabs[nextIndex], true);

            });

        });



        // Initialize the default active section.

        activateSection(navTabs[0]);



        // Reposition the underline when the window is resized.

        window.addEventListener('resize', () => {

            const activeTab = navTabs.find(

                tab => tab.getAttribute('aria-selected') === 'true'

            );



            if (activeTab) moveNavIndicator(activeTab);

        });



        // Position the underline after fonts and layout have loaded.

        requestAnimationFrame(() => moveNavIndicator(navTabs[0]));



        async function loadExperience() {

            const container = document.getElementById("experience-container");



            if (!container) return;



            try {

                const response = await fetch("./experience.json");



                if (!response.ok) {

                    throw new Error("Failed to load experience.json");

                }



                const experiences = await response.json();



                container.innerHTML = experiences.map(exp => `

      <article class="mb-8">

        <div class="flex flex-col sm:flex-row sm:justify-between gap-2">

          <div>

            <h3 class="text-xl font-semibold">${escapeHTML(exp.role)}</h3>

            <p class="text-sm opacity-80">

              ${escapeHTML(exp.company)} · ${escapeHTML(exp.location)}

            </p>

          </div>



          <p class="text-sm opacity-70">

            ${escapeHTML(exp.startDate)} – ${escapeHTML(exp.endDate)}

          </p>

        </div>



        ${exp.project ? `

          <p class="mt-3 text-sm font-medium">

            Project: ${escapeHTML(exp.project)}

          </p>

        ` : ""}



        <ul class="mt-4 list-disc pl-5 space-y-2">

          ${(exp.bullets || []).map(bullet => `

            <li class="text-sm leading-relaxed">

              ${escapeHTML(bullet)}

            </li>

          `).join("")}

        </ul>

      </article>

    `).join("");

            } catch (error) {

                console.error("Error loading experience:", error);

                container.innerHTML = `

      <p class="text-sm opacity-70">

        Unable to load experience details.

      </p>

    `;

            }

        }



        function escapeHTML(value = "") {

            return String(value).replace(/[&<>"']/g, char => ({

                "&": "&amp;",

                "<": "&lt;",

                ">": "&gt;",

                '"': "&quot;",

                "'": "&#39;"

            })[char]);

        }





        // --- Dynamic Project Loader ---

        async function loadProjects() {

            const container = document.getElementById('projects-container');



            try {

                const response = await fetch('./projects.json');



                if (!response.ok) {

                    throw new Error('Could not load projects.json');

                }



                const projects = await response.json();



                if (!Array.isArray(projects)) {

                    throw new Error('projects.json must contain an array');

                }



                container.replaceChildren();



                if (projects.length === 0) {

                    container.innerHTML =

                        '<p class="text-sm text-gray-500 dark:text-gray-400">No projects available yet.</p>';

                    return;

                }



                projects.forEach(project => {

                    const wrapper = document.createElement('div');

                    wrapper.className = 'mb-8';



                    const titleRow = document.createElement('div');

                    titleRow.className =

                        'flex justify-between items-baseline flex-wrap mb-1';



                    const link = document.createElement('a');

                    link.href = project.link || '#';

                    link.target = '_blank';

                    link.rel = 'noopener noreferrer';

                    link.className =

                        'font-semibold text-base hover:text-link-color hover:underline underline-offset-4 decoration-gray-300 dark:hover:text-white dark:decoration-gray-700';

                    link.textContent = project.title || 'Untitled project';



                    titleRow.appendChild(link);



                    const details = document.createElement('div');

                    details.className = 'text-sm text-accent-color mt-1';



                    const tags = document.createElement('span');

                    tags.className =

                        'font-mono text-xs text-subtext-color block dark:text-gray-400';

                    tags.textContent = project.tags || '';



                    details.appendChild(tags);

                    wrapper.append(titleRow, details);

                    container.appendChild(wrapper);

                });

            } catch (error) {

                console.error('Failed to load projects:', error);

                container.innerHTML =

                    '<p class="text-sm text-red-500 dark:text-red-400">Error loading projects. Check that projects.json exists and the site is served over HTTP.</p>';

            }

        }



        // --- Dynamic Blog Loader ---

        let loadedBlogs = [];

        async function loadBlogs() {

            const container = document.getElementById('blogs-container');



            try {

                const response = await fetch('./blogs.json');

                if (!response.ok) throw new Error('Could not load blogs.json');



                const blogs = await response.json();

                if (!Array.isArray(blogs)) throw new Error('blogs.json must contain an array');
                loadedBlogs = blogs;

                container.replaceChildren();



                if (blogs.length === 0) {

                    container.innerHTML =

                        '<p class="text-sm text-gray-500 dark:text-gray-400">No blog posts available yet.</p>';

                    return;

                }



                blogs.forEach(blog => {

                    const wrapper = document.createElement('article');

                    wrapper.className = 'mb-8 pb-6 border-b border-gray-200 dark:border-gray-800 last:border-b-0';



                    const titleRow = document.createElement('div');

                    titleRow.className = 'flex justify-between items-baseline flex-wrap gap-x-4 gap-y-1 mb-2';



                    const titleButton = document.createElement('button');

                    titleButton.type = 'button';

                    titleButton.className = 'text-left font-semibold text-base hover:text-link-color hover:underline underline-offset-4 decoration-gray-300 dark:hover:text-white dark:decoration-gray-700';

                    titleButton.textContent = blog.title || 'Untitled post';

                    titleButton.addEventListener('click', () => openBlog(blog));

                    titleRow.appendChild(titleButton);



                    if (blog.date) {

                        const date = document.createElement('span');

                        date.className = 'font-mono text-xs text-gray-500 dark:text-gray-400';

                        date.textContent = blog.date;

                        titleRow.appendChild(date);

                    }



                    const tags = document.createElement('p');

                    tags.className = 'font-mono text-xs text-gray-500 dark:text-gray-400 mb-2';

                    tags.textContent = blog.tags || blog.category || '';



                    const rawContent = blog.content || blog.body || blog.description || '';

                    const preview = document.createElement('p');

                    preview.className = 'text-sm text-gray-600 dark:text-gray-400 leading-6';

                    const plainPreview = String(rawContent).replace(/\s+/g, ' ').trim();

                    preview.textContent = plainPreview

                        ? (plainPreview.length > 180 ? plainPreview.slice(0, 180).trimEnd() + '…' : plainPreview)

                        : 'Read the full post.';



                    const readMore = document.createElement('button');

                    readMore.type = 'button';

                    readMore.className = 'mt-3 text-sm font-medium underline underline-offset-4 decoration-gray-300 hover:text-black dark:decoration-gray-700 dark:hover:text-white';

                    readMore.textContent = 'Read article →';

                    readMore.addEventListener('click', () => openBlog(blog));



                    const shareButton = document.createElement('button');

                    shareButton.type = 'button';

                    shareButton.className =

                        'ml-4 mt-3 text-sm text-gray-500 hover:text-black dark:text-gray-400 dark:hover:text-white';



                    shareButton.innerHTML =

                        '<i class="fas fa-share-alt mr-1"></i> Share';



                    shareButton.addEventListener('click', async () => {
                        const slug = createBlogSlug(blog.slug || blog.title);
                        const shareUrl = `${window.location.origin}${window.location.pathname}?blog=${encodeURIComponent(slug)}`;

                        if (navigator.share) {
                            try {
                                await navigator.share({
                                    title: blog.title || 'Blog post',
                                    text: `Read "${blog.title || 'this blog post'}"`,
                                    url: shareUrl
                                });
                                return;
                            } catch (error) {
                                if (error.name === 'AbortError') return;
                                console.warn('Native sharing unavailable; trying clipboard.', error);
                            }
                        }

                        try {
                            await navigator.clipboard.writeText(shareUrl);
                            shareButton.innerHTML = '<i class="fas fa-check mr-1"></i> Link copied';
                            setTimeout(() => {
                                shareButton.innerHTML = '<i class="fas fa-share-alt mr-1"></i> Share';
                            }, 2000);
                        } catch (error) {
                            window.prompt('Copy this blog link:', shareUrl);
                        }
                    });

                    wrapper.append(titleRow, tags, preview, readMore, shareButton);

                    container.appendChild(wrapper);

                });

            } catch (error) {

                console.error('Failed to load blogs:', error);

                container.innerHTML =

                    '<p class="text-sm text-red-500 dark:text-red-400">Error loading blog posts. Check that blogs.json exists and the site is served over HTTP.</p>';

            }

        }



        function createBlogSlug(title = '') {

            return String(title)

                .toLowerCase()

                .trim()

                .replace(/[^a-z0-9]+/g, '-')

                .replace(/^-+|-+$/g, '');

        }



        function showBlogDetail(blog, updateHistory = true) {
            const slug = createBlogSlug(blog.slug || blog.title);

            if (updateHistory) {
                history.pushState({ blog: slug }, '', `${window.location.pathname}?blog=${encodeURIComponent(slug)}`);
            }

            document.querySelectorAll('.portfolio-panel').forEach(panel => {
                panel.classList.remove('active');
                panel.hidden = true;
            });

            const detailPanel = document.getElementById('blog-detail-panel');
            detailPanel.hidden = false;
            detailPanel.classList.add('active');

            // Keep the Blogs tab selected while an article is open.
            const blogsTab = navTabs.find(tab => tab.dataset.target === 'blogs-panel');
            if (blogsTab) {
                navTabs.forEach(tab => {
                    const selected = tab === blogsTab;
                    tab.setAttribute('aria-selected', String(selected));
                    tab.setAttribute('tabindex', selected ? '0' : '-1');
                });
                moveNavIndicator(blogsTab);
            }

            document.getElementById('blog-detail-title').textContent = blog.title || 'Untitled post';
            document.getElementById('blog-detail-meta').textContent = blog.date || '';
            document.getElementById('blog-detail-tags').textContent = blog.tags || blog.category || '';

            const content = document.getElementById('blog-detail-content');
            content.replaceChildren();
            const articleText = String(blog.content || blog.body || blog.description || '').trim();

            if (articleText) {
                articleText.split(/\n\s*\n/).forEach(paragraphText => {
                    if (!paragraphText.trim()) return;
                    const paragraph = document.createElement('p');
                    paragraph.textContent = paragraphText.trim();
                    content.appendChild(paragraph);
                });
            } else {
                const message = document.createElement('p');
                message.textContent = 'The full article text has not been added to blogs.json yet.';
                content.appendChild(message);
            }

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function openBlog(blog, updateHistory = true) {
            showBlogDetail(blog, updateHistory);
        }

        function showBlogsList(updateHistory = true) {
            document.querySelectorAll('.portfolio-panel').forEach(panel => {
                panel.classList.remove('active');
                panel.hidden = true;
            });

            const blogsPanel = document.getElementById('blogs-panel');
            blogsPanel.hidden = false;
            blogsPanel.classList.add('active');

            const blogsTab = navTabs.find(tab => tab.dataset.target === 'blogs-panel');
            if (blogsTab) {
                navTabs.forEach(tab => {
                    const selected = tab === blogsTab;
                    tab.setAttribute('aria-selected', String(selected));
                    tab.setAttribute('tabindex', selected ? '0' : '-1');
                });
                moveNavIndicator(blogsTab);
            }

            if (updateHistory) {
                history.pushState({}, '', window.location.pathname);
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function returnToBlogs() {
            showBlogsList(true);
        }

        document.getElementById('back-to-blogs').addEventListener('click', returnToBlogs);

        window.addEventListener('popstate', () => {
            const requestedSlug = new URLSearchParams(window.location.search).get('blog');
            if (requestedSlug) {
                const blog = loadedBlogs.find(item => createBlogSlug(item.slug || item.title) === requestedSlug);
                if (blog) {
                    openBlog(blog, false);
                    return;
                }
            }
            showBlogsList(false);
        });

        // --- Typewriter Effect --

        const phrases = [

            'I build things that scale.',

            'Java. Angular. Distributed systems.',

            'Turning complex problems into clean code.',

            'From API design to production.',

            'Building beyond the happy path.',

            'Making systems faster and more resilient.',

            'Less complexity. Better engineering.',

            'Good code. Solid systems. Real impact.'

        ];

        const typewriterElement = document.getElementById('typewriter-text');

        const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));



        async function runTypewriter() {

            let phraseIndex = 0;



            while (true) {

                const phrase = phrases[phraseIndex];



                for (let i = 0; i < phrase.length; i++) {

                    typewriterElement.textContent = phrase.substring(0, i + 1);

                    await sleep(100);

                }



                await sleep(2000);



                for (let i = phrase.length; i > 0; i--) {

                    typewriterElement.textContent = phrase.substring(0, i - 1);

                    await sleep(50);

                }



                await sleep(500);

                phraseIndex = (phraseIndex + 1) % phrases.length;

            }

        }



        async function openSharedBlog() {
            const requestedSlug = new URLSearchParams(window.location.search).get('blog');
            if (!requestedSlug) return;

            // URLSearchParams decodes the query value. Normalize both sides to
            // tolerate punctuation, capitalization, and spacing differences.
            const normalizeSlug = value => createBlogSlug(String(value || '').replace(/\\+/g, '-'));
            const targetSlug = normalizeSlug(requestedSlug);

            try {
                // loadBlogs() has already populated loadedBlogs before this runs.
                const blog = loadedBlogs.find(item =>
                    normalizeSlug(item.slug || item.title) === targetSlug
                );

                if (blog) {
                    // Render the article without adding a duplicate history entry.
                    showBlogDetail(blog, false);
                } else {
                    console.error('Blog not found for URL slug:', targetSlug);
                    showBlogsList(false);
                }
            } catch (error) {
                console.error('Unable to open shared blog:', error);
                showBlogsList(false);
            }
        }

        // Initialize even if this script runs after DOMContentLoaded.
        async function initializePortfolio() {
            loadProjects();
            await loadExperience();
            await loadBlogs();
            await openSharedBlog();
            runTypewriter();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializePortfolio, { once: true });
        } else {
            initializePortfolio();
        }

    </script>

</body>

</html>
